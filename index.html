<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Primary SEO Meta Tags -->
    <title>LocalFind - Find Products in Nearby Local Shops (2 km Radius)</title>
    <meta name="title" content="LocalFind - Find Products in Nearby Local Shops (2 km Radius)" />
    <meta name="description" content="Discover products available in physical retail shops right around your neighborhood within 2 km. Live stock sync, Hindi voice search, Flash Deals, and 0% commission direct WhatsApp buying." />
    <meta name="keywords" content="local shopping, nearby shops, kirana store search, localfind, buy nearby, hyperlocal store window, retail stock, flash deals near me, hinglish shopping search" />
    <meta name="author" content="Naksh" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#9c3e20" />
    <link rel="canonical" href="https://localfind.pages.dev" />

    <!-- Open Graph / Facebook / WhatsApp Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://localfind.pages.dev" />
    <meta property="og:title" content="LocalFind - Hyperlocal Store Window" />
    <meta property="og:description" content="Find products in local neighborhood shops within walking distance. Zero commission, direct WhatsApp chat, and live store hours." />
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://localfind.pages.dev" />
    <meta property="twitter:title" content="LocalFind - Hyperlocal Store Window" />
    <meta property="twitter:description" content="Find products in local neighborhood shops within 2 km. Zero commission, live deals, and Hindi voice search." />
    <meta property="twitter:image" content="/logo.svg" />

    <!-- Structured Data (JSON-LD Schema for Google Search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "LocalFind",
      "applicationCategory": "ShoppingApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "description": "Hyperlocal store window connecting local buyers and retail shopkeepers within a 2 km radius.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://localfind.pages.dev/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Work+Sans:wght@500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  </head>
  <body class="bg-surface text-on-surface font-body-sm text-body-sm antialiased selection:bg-primary/20 selection:text-primary min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
