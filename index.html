<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="LocalFind" />
    <meta name="apple-mobile-web-app-title" content="LocalFind" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    
    <!-- Primary SEO & Color Meta Tags for Android System Bars -->
    <title>LocalFind - Find Products in Nearby Local Shops (2 km Radius)</title>
    <meta name="title" content="LocalFind - Find Products in Nearby Local Shops (2 km Radius)" />
    <meta name="description" content="Discover products available in physical retail shops right around your neighborhood within 2 km. Live stock sync, Hindi voice search, Flash Deals, and 0% commission direct WhatsApp buying." />
    <meta name="keywords" content="local shopping, nearby shops, kirana store search, localfind, buy nearby, hyperlocal store window, retail stock, flash deals near me, hinglish shopping search" />
    <meta name="author" content="Naksh" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#9c3e20" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a110f" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://localfind.pages.dev" />

    <!-- Open Graph / Facebook / WhatsApp Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://localfind.pages.dev" />
    <meta property="og:title" content="LocalFind - Hyperlocal Store Window" />
    <meta property="og:description" content="Find products in local neighborhood shops within walking distance. Zero commission, direct WhatsApp chat, and live store hours." />
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://localfind.pages.dev" />
    <meta property="twitter:title" content="LocalFind - Hyperlocal Store Window" />
    <meta property="twitter:description" content="Find products in local neighborhood shops within 2 km. Zero commission, live deals, and Hindi voice search." />
    <meta property="twitter:image" content="/logo.svg" />

    <!-- Structured Data (JSON-LD Schema for Google Search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "LocalFind",
      "applicationCategory": "ShoppingApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "description": "Hyperlocal store window connecting local buyers and retail shopkeepers within a 2 km radius.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://localfind.pages.dev/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- Android map perf: preconnect OSM tiles + Nominatim (saves 200-300ms DNS+TLS on 4G) -->
    <link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://b.tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://c.tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://nominatim.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://a.tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="https://b.tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="https://c.tile.openstreetmap.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Work+Sans:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Work+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />
    </noscript>
  </head>
  <body class="bg-surface text-on-surface font-body-sm text-body-sm antialiased selection:bg-primary/20 selection:text-primary min-h-screen">
    <div id="root">
      <!-- 🛡️ Instant Pre-Boot Splash (Prevents FOUC / Component Flash) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #fff8f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: #9c3e20; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px -4px rgba(156, 62, 32, 0.25); margin-bottom: 16px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </div>
        <div style="font-size: 20px; font-weight: 800; color: #9c3e20; letter-spacing: -0.02em;">LocalFind</div>
        <div style="font-size: 11px; color: #77574e; margin-top: 4px; font-weight: 600;">Connecting local neighborhood shops</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
