<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-container-margin relative overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary-fixed opacity-40 rounded-full blur-[80px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-secondary-fixed opacity-40 rounded-full blur-[80px]"></div>
<!-- Main Container -->
<main class="w-full max-w-md relative z-10">
<!-- Login Card -->
<div class="glass-panel rounded-xl shadow-[0px_8px_32px_rgba(0,0,0,0.04)] p-8">
<!-- Header Section -->
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-highest text-primary mb-stack-md shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary mb-unit">LocalFind</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Grow your local business with LocalFind</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-stack-md" method="POST">
<!-- Email Input -->
<div>
<label class="block font-title-md text-title-md text-on-surface mb-unit" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-bright text-on-surface font-body-lg text-body-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="email" name="email" placeholder="shop@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex items-center justify-between mb-unit">
<label class="block font-title-md text-title-md text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-bright text-on-surface font-body-lg text-body-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Login Button -->
<div class="pt-stack-sm">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-[0px_8px_16px_rgba(156,62,32,0.1)] font-title-md text-title-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-95 transition-all duration-200" type="submit">
                        Shopkeeper Login
                        <span class="material-symbols-outlined ml-2">arrow_forward</span>
</button>
</div>
</form>
<!-- Registration Link -->
<div class="mt-stack-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    New to LocalFind? 
                    <a class="font-title-md text-title-md text-secondary hover:text-secondary-container transition-colors ml-1" href="#">Register your Shop</a>
</p>
</div>
</div>
