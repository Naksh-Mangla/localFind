<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Terracotta Gradient -->
    <linearGradient id="lf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C3E20" />
      <stop offset="50%" stop-color="#C85A32" />
      <stop offset="100%" stop-color="#E07A5F" />
    </linearGradient>

    <!-- Warm Amber Gold Accent Gradient -->
    <linearGradient id="lf-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="lf-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#9C3E20" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Badge Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#lf-grad)" filter="url(#lf-shadow)" />

  <!-- Outer Map Location Pin -->
  <path d="M256 96C185.3 96 128 153.3 128 224C128 316 230 406 248.8 421.8C253 425.3 259 425.3 263.2 421.8C282 406 384 316 384 224C384 153.3 326.7 96 256 96Z" fill="#FFFFFF" fill-opacity="0.98" />

  <!-- Shopping Bag Arch Cutout -->
  <path d="M220 190C220 170.1 236.1 154 256 154C275.9 154 292 170.1 292 190V215H272V190C272 181.2 264.8 174 256 174C247.2 174 240 181.2 240 190V215H220V190Z" fill="url(#lf-grad)" />

  <!-- Shopping Bag Body Base -->
  <path d="M192 230C192 220 200 212 210 212H302C312 212 320 220 320 230V272C320 288.5 306.5 302 290 302H222C205.5 302 192 288.5 192 272V230Z" fill="url(#lf-grad)" />

  <!-- Inner Sparkle/Location Core -->
  <circle cx="256" cy="256" r="22" fill="url(#lf-accent)" />
</svg>
